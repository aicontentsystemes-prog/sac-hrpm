name: Auto-generate articles (daily)

on:
  schedule:
    - cron: '0 12 * * *'   # Ejecuta todos los días a las 12:00 UTC (07:00 hora Lima)
  workflow_dispatch:       # Permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests huggingface_hub

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run generator
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: python generator.py

      - name: Commit generated content
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add content
            git commit -m "Auto-generated article [ci skip]"
            git push origin HEAD:main
          else
            echo "No new content to commit."
          fi
