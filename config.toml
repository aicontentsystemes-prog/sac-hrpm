baseURL = 'https://aicontentsystem.github.io/sac-hrpm/'
title = 'SAC-HRPM | Sistema Autónomo de Contenido de Alto RPM'
languageCode = 'en-us'
theme = 'ananke'
defaultContentLanguage = 'en'

[params]
  description = 'Plataforma autónoma de generación, optimización y monetización de contenido de alto RPM impulsada por IA.'
  background_color_class = 'bg-black'
  recent_posts_number = 6

[languages]
